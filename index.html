<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Crazy Squid Solver</title>
<!-- PWA / installable home-screen app -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e1116">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Squid Solver">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root{
    --bg:#0e1116;--panel:#161b22;--panel2:#1c2330;--ink:#e6edf3;--muted:#98a2ae;
    --accent:#2f81f7;--accent2:#1f6feb;--good:#3fb950;--bad:#f85149;--warn:#d29922;
    --line:#30363d;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;line-height:1.45;font-size:14px}
  header{padding:18px 26px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
    padding-top:calc(18px + env(safe-area-inset-top));
    padding-left:calc(26px + env(safe-area-inset-left));
    padding-right:calc(26px + env(safe-area-inset-right))}
  main{padding-bottom:calc(22px + env(safe-area-inset-bottom))}
  h1{font-size:21px;margin:0;letter-spacing:.3px}
  h1 .em{color:var(--accent)}
  .sub{color:var(--muted);font-size:12.5px}
  main{max-width:1080px;margin:0 auto;padding:22px 26px;display:grid;grid-template-columns:1fr 1fr;gap:22px}
  @media(max-width:820px){main{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
  .card h2{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:0 0 14px;display:flex;align-items:center}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:9px 0}
  .row label{flex:1;color:var(--ink)}
  .row .hint{display:block;color:var(--muted);font-size:12px;margin-top:1px}
  input[type=number],select{background:var(--bg);border:1px solid var(--line);color:var(--ink);
    border-radius:7px;padding:7px 9px;font-family:var(--mono);font-size:13px;width:110px;text-align:right}
  select{text-align:left;width:150px}
  input[type=number]:focus,select:focus{outline:none;border-color:var(--accent)}
  /* 16px stops iOS Safari / WKWebView from auto-zooming the page when a field is focused */
  @media(max-width:820px){input[type=number],select{font-size:16px}}
  .toggle{position:relative;width:42px;height:23px;flex:0 0 auto;-webkit-tap-highlight-color:transparent}
  .toggle::after{content:"";position:absolute;inset:-10px -8px}   /* bigger tap target */
  .toggle input{display:none}
  .toggle span{position:absolute;inset:0;background:var(--panel2);border:1px solid var(--line);
    border-radius:20px;transition:.15s;cursor:pointer}
  .toggle span:before{content:"";position:absolute;width:17px;height:17px;left:2px;top:2px;
    background:var(--muted);border-radius:50%;transition:.15s}
  .toggle input:checked+span{background:var(--accent)}
  .toggle input:checked+span:before{transform:translateX(19px);background:#fff}
  .sub-block{border-left:2px solid var(--line);padding-left:12px;margin:6px 0 12px}
  .sub-block.off{opacity:.4;pointer-events:none}
  table.mini{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:4px}
  table.mini th,table.mini td{border:1px solid var(--line);padding:4px 6px;text-align:center}
  table.mini th{color:var(--muted);font-weight:500}
  table.mini input{width:60px;padding:4px}
  .players{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .players .pl{display:flex;flex-direction:column;align-items:center;gap:3px}
  .players .pl span{font-size:12px;color:var(--muted)}
  .players .pl input{width:54px;text-align:center}
  .players .pl.hero input{border-color:var(--accent)}
  button.run{width:100%;background:var(--accent);color:#fff;border:0;border-radius:9px;
    padding:12px;font-size:15px;font-weight:600;cursor:pointer;margin-top:8px}
  button.run:hover{background:var(--accent2)}
  button.run:disabled{opacity:.55;cursor:default}
  /* results */
  .live{font-size:12px;color:var(--good);margin-left:10px;text-transform:none;letter-spacing:0;display:none}
  .live.on{display:inline}
  .live.wait{color:var(--warn)}
  .results.stale #resBody{opacity:.45;transition:opacity .15s}
  .warn{background:rgba(210,153,34,.12);border:1px solid var(--warn);color:var(--warn);border-radius:9px;
    padding:8px 11px;font-size:12.5px;margin-bottom:12px;line-height:1.5}
  .warn.info{background:rgba(47,129,247,.08);border-color:var(--accent2);color:var(--muted)}
  .headline{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--accent);
    border-radius:12px;padding:16px 18px 14px;margin-bottom:12px}
  .headline .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;display:block}
  .headline .v{font-size:48px;line-height:1.05;font-family:var(--mono);font-weight:600;margin-top:6px;letter-spacing:-.5px}
  .headline .v.pos{color:var(--good)}.headline .v.neg{color:var(--bad)}
  .headline .u{font-size:12.5px;color:var(--muted);margin-top:4px}
  @media(max-width:400px){.headline .v{font-size:40px}}
  .rtable{width:100%;border-collapse:collapse;margin-top:4px;font-size:13px}
  .rtable td{padding:6px 4px;border-bottom:1px solid var(--line)}
  .rtable td:last-child{text-align:right;font-family:var(--mono);white-space:nowrap}
  .rtable td.lbl{color:var(--muted)}
  .rtable td.pos{color:var(--good)}.rtable td.neg{color:var(--bad)}
  .rtable tr.exp-host td{padding:0;border:0}
  .placeholder{color:var(--muted);text-align:center;padding:40px 0;font-size:13px}
  .note{color:var(--muted);font-size:12px;margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
  .info{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;position:relative;
    border:1px solid var(--line);border-radius:50%;font-size:11px;font-style:italic;font-family:Georgia,serif;
    color:var(--muted);margin-left:6px;cursor:pointer;user-select:none;vertical-align:middle;flex:0 0 auto;
    -webkit-tap-highlight-color:transparent}
  .info[data-exp]::after{content:"";position:absolute;inset:-12px}   /* ~40px tap target around the 17px chip */
  .info:hover,.info.on,.info:focus-visible{border-color:var(--accent);color:var(--accent);outline:none}
  .exp{display:none;font-size:12px;color:var(--muted);margin:8px 0 4px;line-height:1.45;
    background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;text-transform:none;letter-spacing:0}
  .exp.show{display:block}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;
    border-radius:50%;animation:s .6s linear infinite;vertical-align:-2px;margin-right:6px}
  @keyframes s{to{transform:rotate(360deg)}}
  details summary{cursor:pointer;color:var(--muted);font-size:12px;margin-top:6px}
  details.outlook{margin-top:14px}
  details.outlook summary{font-size:12px;text-transform:uppercase;letter-spacing:1px}
  details.outlook .rtable{margin-top:8px}
</style>
</head>
<body>
<header>
  <h1>🦑 Crazy Squid <span class="em">Solver</span></h1>
  <span class="sub">Exact EV solver — runs entirely in your browser</span>
</header>
<main>
  <!-- ============ INPUTS ============ -->
  <div class="card" id="inputs">
    <h2>Inputs</h2>

    <div class="row"><label># of Players</label>
      <input type="number" id="nPlayers" inputmode="numeric" min="3" max="10" step="1" value="7"></div>
    <div class="row"><label>Squid payment per Button <span class="hint">in BB</span></label>
      <input type="number" id="squidPay" inputmode="decimal" step="0.5" value="2"></div>
    <div class="row"><label>Buttons to End <span class="hint">max hands before game ends</span></label>
      <input type="number" id="buttonsToEnd" inputmode="numeric" step="1" value="10"></div>
    <div class="row"><label>Buttons to be Safe</label>
      <input type="number" id="buttonsToBeSafe" inputmode="numeric" step="1" min="1" value="1"></div>
    <div class="row"><label>Fight Factor <span class="hint">1 = no extra fight, 2 = max</span></label>
      <input type="number" id="fightFactor" inputmode="decimal" step="0.05" min="1" max="2" value="1.1"></div>
    <div class="row"><label>Level of fishiness</label>
      <select id="fishiness">
        <option value="0.1">Minor Whales</option>
        <option value="0.31" selected>Medium Whales</option>
        <option value="0.5">Mega Whales</option>
      </select></div>

    <div class="row"><label>Enable Multipliers</label>
      <label class="toggle"><input type="checkbox" id="enableMult" checked><span></span></label></div>
    <div class="sub-block" id="multBlock">
      <table class="mini">
        <tr><th># Buttons ≥</th><th>Multiplier</th></tr>
        <tr><td><input type="number" id="mt0" inputmode="numeric" value="3"></td><td><input type="number" id="mv0" inputmode="decimal" value="2"></td></tr>
        <tr><td><input type="number" id="mt1" inputmode="numeric" value="5"></td><td><input type="number" id="mv1" inputmode="decimal" value="3"></td></tr>
        <tr><td><input type="number" id="mt2" inputmode="numeric" value="7"></td><td><input type="number" id="mv2" inputmode="decimal" value="4"></td></tr>
      </table>
    </div>

    <div class="row"><label>Enable Bonuses <span class="hint">in BB</span></label>
      <label class="toggle"><input type="checkbox" id="enableBonus"><span></span></label></div>
    <div class="sub-block off" id="bonusBlock">
      <div class="row"><label># of Buttons ≥</label><input type="number" id="bonusThresh" inputmode="numeric" value="10"></div>
      <div class="row"><label>Bonus value</label><input type="number" id="bonusValue" inputmode="decimal" value="0"></div>
    </div>

    <div class="row"><label>Each loser splashes next pot <span class="hint">penalty in BB</span></label>
      <input type="number" id="splashPenalty" inputmode="decimal" step="0.5" value="0"></div>
    <div class="row"><label>Losers share the penalty</label>
      <label class="toggle"><input type="checkbox" id="losersShare"><span></span></label></div>

    <h2 style="margin-top:18px">Current Button Counts</h2>
    <div class="hint" style="color:var(--muted);font-size:12px">Hero is highlighted. Set how many buttons each player already holds.</div>
    <div class="players" id="players"></div>

    <details><summary>Advanced</summary>
      <div class="row" style="margin-top:8px"><label>Engine <span class="hint">Exact = every possible finish, weighted by probability. Results update live.</span></label>
        <select id="engine">
          <option value="exact" selected>Exact (recommended)</option>
          <option value="mc">Monte Carlo (cross-check)</option>
        </select></div>
      <div class="row"><label># of simulations <span class="hint">Monte Carlo only — higher = more accurate, slower</span></label>
        <input type="number" id="nSims" inputmode="numeric" step="5000" value="30000"></div>
    </details>

    <button class="run" id="run">Run Solver</button>
  </div>

  <!-- ============ RESULTS ============ -->
  <div class="card results" id="results">
    <h2>Results <span class="live" id="liveTag">● live</span></h2>
    <div id="resBody" aria-live="polite"><div class="placeholder">Set your inputs and hit <b>Run Solver</b>.</div></div>
  </div>
</main>

<script>
// ===================== helpers =====================
const $=id=>document.getElementById(id);
// numeric field → number, or NaN when the field is blank (so blanks can be treated as "not set")
const num=id=>{const s=$(id).value.trim(); return s===''?NaN:+s;};
const MAX_BTE=100000;   // hard cap on Buttons to End (keeps a stray huge number from hanging the tab)
const playerVals={};   // remembered button count per seat — survives shrinking and re-growing the grid
// commit=false while typing (only rebuild once the field holds a valid 3–10), commit=true on blur/enter (clamp + write back)
function buildPlayers(commit){
  const box=$('players'), field=$('nPlayers');
  [...box.querySelectorAll('input')].forEach(i=>playerVals[i.dataset.i]=i.value);
  let n=+field.value.trim();
  if(!(Number.isInteger(n)&&n>=3&&n<=10)){
    if(!commit) return;                                   // mid-edit ("1" on the way to "10", or blank): leave the grid alone
    n=Math.max(3,Math.min(10,Math.floor(n)||3)); field.value=n;
  }
  if(box.querySelectorAll('input').length===n) return;
  box.innerHTML='';
  for(let i=0;i<n;i++){
    const d=document.createElement('div');
    d.className='pl'+(i===0?' hero':'');
    d.innerHTML=`<span>${i===0?'Hero':'P'+(i+1)}</span>
      <input type="number" min="0" step="1" data-i="${i}" value="${playerVals[i]??0}">`;
    box.appendChild(d);
  }
}
function readPlayers(){return [...$('players').querySelectorAll('input')].map(i=>Math.max(0,Math.floor(+i.value||0)));}

function readInputs(){
  const mult=$('enableMult').checked, bonus=$('enableBonus').checked;
  // a blank threshold or value means "row not set" (the sheet's ISBLANK filter) — kept as NaN and skipped by effMult
  const thresholds=[num('mt0'),num('mt1'),num('mt2')];
  const values=[num('mv0'),num('mv1'),num('mv2')];
  const start=readPlayers();            // # of players is whatever the button grid currently shows
  const bt=num('bonusThresh');
  const ffRaw=+$('fightFactor').value;                    // must be > 0; anything else falls back to 1 (flagged by sanity)
  return {
    nPlayers:start.length, squidPay:+$('squidPay').value||0,
    buttonsToEnd:Math.min(MAX_BTE,Math.max(0,Math.floor(+$('buttonsToEnd').value||0))),
    buttonsToBeSafe:Math.max(1,Math.floor(+$('buttonsToBeSafe').value||1)),
    fightFactor:ffRaw>0?ffRaw:1, ffInvalid:!(ffRaw>0), fishiness:+$('fishiness').value,
    enableMult:mult, thresholds, values,
    enableBonus:bonus, bonusThresh:isFinite(bt)?bt:Infinity, bonusValue:+$('bonusValue').value||0,
    splashPenalty:+$('splashPenalty').value||0, losersShare:$('losersShare').checked,
    start, nSims:Math.max(2000,+$('nSims').value||30000), engine:$('engine').value,
  };
}

// multiplier for a button count (Processed Simulation: MAX of the multipliers whose threshold is met, else 1).
// Rows with a blank threshold or value are ignored, like the sheet's NOT(ISBLANK()) filter.
function effMult(b,I){
  if(!I.enableMult) return 1;
  let m=1;
  for(let k=0;k<I.thresholds.length;k++){
    const t=I.thresholds[k], v=I.values[k];
    if(Number.isFinite(t)&&Number.isFinite(v)&&b>=t) m=Math.max(m,v);
  }
  return m;
}

// ===================== payment layer (Processed Simulation formulas) =====================
// What each loser pays at the end of the game (column AK): winners' receipts split among the losers,
// plus each loser's share of the splash penalty. 0 if nobody lost.
function loserPays(s,I){
  const n=s.length, safe=I.buttonsToBeSafe;
  let nLosers=0; for(let i=0;i<n;i++) if(s[i]<safe) nLosers++;
  if(nLosers===0) return 0;
  let AH=0;
  for(let i=0;i<n;i++) if(s[i]>=safe) AH+=s[i]*effMult(s[i],I)*I.squidPay*(I.losersShare?1:nLosers);
  return AH/nLosers + I.splashPenalty/nLosers;
}
// Hero's net result for a given END state (column AL).
// One deliberate deviation from the sheet: with no losers at all (only possible if every player was
// already safe before the game started) nobody pays, so hero's receipt is 0 — the sheet would still
// credit hero a receipt under "losers share the penalty" even though there is no loser to pay it.
function heroEVForState(s,I){
  const n=s.length, safe=I.buttonsToBeSafe;
  let base;
  if(s[0]>=safe){
    let nLosers=0; for(let i=0;i<n;i++) if(s[i]<safe) nLosers++;
    base=nLosers===0?0:s[0]*effMult(s[0],I)*I.squidPay*(I.losersShare?1:nLosers);   // hero collects
  }else{
    base=-loserPays(s,I);                                             // hero pays as a loser
  }
  let bonus=0;
  if(I.enableBonus){
    bonus=(s[0]>=I.bonusThresh?I.bonusValue*(n-1):0);
    let others=0; for(let i=1;i<n;i++) if(s[i]>=I.bonusThresh) others++;
    bonus-=others*I.bonusValue;
  }
  return base+bonus;
}

// ===================== Exact engine (dynamic programming) =====================
// Hero's payoff depends only on hero's count and the multiset of the opponents' counts, and the
// hand dynamics are symmetric among opponents, so every state is canonicalised as
// (hero, sorted opponents). Each hand adds exactly one button, so the recursion is a finite DAG:
// expectations are computed exactly — no Monte Carlo noise — in a few milliseconds.
const MAX_STATES=1500000;   // beyond this we fall back to Monte Carlo (only reachable with absurd inputs)
function makeExact(I){
  const safe=I.buttonsToBeSafe, ff=I.fightFactor, bte=I.buttonsToEnd;
  const memo=new Map();
  // game over? (checked BEFORE each hand, same as simulateGame)
  function terminal(h,o){
    let unsafe=h<safe?1:0, sum=h;
    for(const c of o){ if(c<safe) unsafe++; sum+=c; }
    return unsafe<=1 || sum>=bte;
  }
  // successors of a non-terminal state: [[prob, h, o], ...]
  function successors(h,o){
    const wh=h<safe?ff:1; let W=wh;
    for(const c of o) W+=c<safe?ff:1;
    const out=[[wh/W,h+1,o]];
    for(let i=0;i<o.length;i++){
      if(i<o.length-1 && o[i+1]===o[i]) continue;      // one transition per distinct value…
      let m=1; for(let j=i-1;j>=0&&o[j]===o[i];j--) m++; // …weighted by its multiplicity
      const next=o.slice(); next[i]++;                    // bump the LAST occurrence → stays sorted
      out.push([m*(o[i]<safe?ff:1)/W,h,next]);
    }
    return out;
  }
  // expected hero payoff from state (h,o) to the end of the game
  function V(h,o){
    const k=h+'|'+o.join(',');
    const hit=memo.get(k); if(hit!==undefined) return hit;
    let v=0;
    if(terminal(h,o)) v=heroEVForState([h,...o],I);
    else for(const [p,h2,o2] of successors(h,o)) v+=p*V(h2,o2);
    if(memo.size>MAX_STATES) throw new Error('exact-overflow');
    memo.set(k,v);
    return v;
  }
  // exact probability distribution over END states, level by level (one button per hand)
  function finalDistribution(h,o){
    let level=new Map([[h+'|'+o.join(','),{h,o,p:1}]]);
    const out=[];
    while(level.size){
      const next=new Map();
      for(const st of level.values()){
        if(terminal(st.h,st.o)){ out.push(st); continue; }
        for(const [p,h2,o2] of successors(st.h,st.o)){
          const k=h2+'|'+o2.join(',');
          const e=next.get(k);
          if(e) e.p+=st.p*p; else next.set(k,{h:h2,o:o2,p:st.p*p});
        }
      }
      level=next;
    }
    return out;
  }
  return {V,terminal,finalDistribution,size:()=>memo.size};
}
function canon(start){ return {h:start[0], o:start.slice(1).sort((a,b)=>a-b)}; }

// E[hero payoff], E[· | hero wins the next hand], E[· | opponent p wins the next hand] — exactly.
// Mirrors simulateGame: if the game is already over nothing is forced and every EV is the terminal payoff.
function exactConditionalEVs(I){
  const X=makeExact(I);
  const {h,o}=canon(I.start);
  const n=I.nPlayers;
  const totalEquity=X.V(h,o);
  if(X.terminal(h,o)) return {X,totalEquity,evHeroWins:totalEquity,evOppWins:new Array(n-1).fill(totalEquity)};
  const evHeroWins=X.V(h+1,o);
  const evOppWins=[];
  for(let p=1;p<n;p++){
    const o2=I.start.slice(1); o2[p-1]++; o2.sort((a,b)=>a-b);
    evOppWins.push(X.V(h,o2));
  }
  return {X,totalEquity,evHeroWins,evOppWins};
}

// "Game outlook": exact probabilities/averages over how the game ends (the spreadsheet's Analysis sheet).
function outlook(I,X){
  const {h,o}=canon(I.start);
  const dist=X.finalDistribution(h,o);
  const safe=I.buttonsToBeSafe;
  const startSum=I.start.reduce((a,b)=>a+b,0);
  let pHeroSafe=0,eHero=0,eLosers=0,eHands=0,eLoss=0,pAnyLoser=0;
  const mult=I.enableMult?I.thresholds.map((t,k)=>({t,v:I.values[k],hero:0,any:0}))
                            .filter(m=>Number.isFinite(m.t)&&Number.isFinite(m.v)):[];   // blank rows are not multipliers
  for(const st of dist){
    const s=[st.h,...st.o], p=st.p;
    let nLosers=0, mx=0, sum=0;
    for(const c of s){ if(c<safe) nLosers++; if(c>mx) mx=c; sum+=c; }
    if(st.h>=safe) pHeroSafe+=p;
    eHero+=p*st.h; eLosers+=p*nLosers; eHands+=p*(sum-startSum);
    if(nLosers>0){ pAnyLoser+=p; eLoss+=p*loserPays(s,I); }
    for(const m of mult){ if(st.h>=m.t) m.hero+=p; if(mx>=m.t) m.any+=p; }
  }
  return {pHeroSafe,eHero,eLosers,eHands,avgLoss:pAnyLoser>0?eLoss/pAnyLoser:0,pAnyLoser,mult,endStates:dist.length};
}

// ===================== Monte Carlo engine (kept as a cross-check) =====================
// Simulate one game forward from `state` (array of button counts) to the end condition.
// Returns final state (array). If forceFirstWinner != null, that player wins hand #1 (the random
// draw for hand #1 is still consumed so every scenario sees the same random stream afterwards).
function simulateGame(state, I, rng, forceFirstWinner){
  const n=state.length;
  const s=state.slice();
  const safe=I.buttonsToBeSafe;
  let handsPlayed=0;
  // count already-distributed buttons; game ends after buttonsToEnd hands total from a fresh game.
  // We model hands remaining as buttonsToEnd minus buttons already on the table.
  let distributed=s.reduce((a,b)=>a+b,0);
  while(true){
    // end condition: all but one player safe, OR reached buttonsToEnd buttons handed out
    const unsafeIdx=[];
    for(let i=0;i<n;i++) if(s[i]<safe) unsafeIdx.push(i);
    if(unsafeIdx.length<=1) break;
    if(distributed>=I.buttonsToEnd) break;
    // pick winner, fight-weighted
    let total=0; const w=new Array(n);
    for(let i=0;i<n;i++){ w[i]=(s[i]<safe)?I.fightFactor:1; total+=w[i]; }
    let r=rng()*total, acc=0, winner=n-1;
    for(let i=0;i<n;i++){ acc+=w[i]; if(r<=acc){winner=i;break;} }
    if(handsPlayed===0 && forceFirstWinner!=null) winner=forceFirstWinner;
    s[winner]++; distributed++; handsPlayed++;
    if(handsPlayed>500) break; // safety
  }
  return s;
}
// simple seeded RNG (mulberry32) for reproducibility
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;}}
// Run nSims from start state (optionally forcing first winner), return avg hero EV.
// Game k is always driven by the same seeded stream regardless of which scenario is being run
// ("common random numbers"): the scenarios then share their luck from hand 2 on, so their
// differences — which is what the per-hand ante is — carry far less sampling noise.
const MC_SEED=0x5169;
function expectedHeroEV(I,forceFirstWinner){
  let sum=0;
  for(let k=0;k<I.nSims;k++){
    const rng=mulberry32((MC_SEED+Math.imul(k+1,0x9E3779B1))|0);
    const end=simulateGame(I.start,I,rng,forceFirstWinner);
    sum+=heroEVForState(end,I);
  }
  return sum/I.nSims;
}
function mcConditionalEVs(I){
  const n=I.nPlayers;
  const totalEquity=expectedHeroEV(I,null);
  const evHeroWins=expectedHeroEV(I,0);
  const evOppWins=[];
  for(let p=1;p<n;p++) evOppWins.push(expectedHeroEV(I,p));
  return {X:null,totalEquity,evHeroWins,evOppWins};
}

// ===================== Desperation model (Model!M:X) =====================
function desperation(I,B19){
  // hands left = buttonsToEnd - buttons already distributed (one button per hand)
  const distributed=I.start.reduce((a,b)=>a+b,0);
  const handsLeft=Math.max(0,I.buttonsToEnd-distributed);
  if(handsLeft<=1) return {bonus:0,penalty:0,handsLeft};
  const ff=I.fightFactor, R=I.fishiness, nP=I.nPlayers, safe=I.buttonsToBeSafe;
  const initUnsafe=I.start.filter(b=>b<safe).length;
  // The model assumes winning the next button is worth something (B19 > 0): the sheet's B19^0.7 errors
  // out for a negative ante. Here a non-positive ante simply yields no desperation bonus/penalty.
  if(!(B19>0)) return {bonus:0,penalty:0,handsLeft,undefinedAnte:true};
  // Walk the per-hand rows, index 0 = "we are here" (m=handsLeft), index i = after i hands.
  // Recurrence mirrors Model sheet columns M,N,O,P,S,T,U,W (accumulated in place — no per-hand objects).
  // Bonus = V at row index 1 (state after the upcoming hand) = sum of U from idx 1 down.
  // Penalty = X at row index 1 = (1/N[1]) * SUMPRODUCT(W[i],N[i]) for i>=1.
  let N=initUnsafe, N1=0, bonus=0, sp=0;
  for(let i=0;i<handsLeft;i++){
    const m=handsLeft-i;
    const O=nP-N;
    const P=(N*ff)/(N*ff+O*1);
    const S=R*Math.pow(m,-0.7)*Math.pow(B19,0.7);
    const U=(S*N)/(nP-1);          // winner's EV gain per player w/button
    const W=S*(O/(nP-1));          // EV loss per player
    if(i>=1){ bonus+=U; sp+=W*N; }
    if(i===1) N1=N;
    N=Math.max(0,N-1*P*(1/safe));
  }
  const penalty = N1>0 ? sp/N1 : 0;
  return {bonus, penalty, handsLeft};
}

// ===================== input sanity (Sanity Checks sheet) =====================
// Returns [{level:'warn'|'info', msg}] — warnings never block the solve.
function sanity(I){
  const w=[], warn=msg=>w.push({level:'warn',msg}), info=msg=>w.push({level:'info',msg});
  const sum=I.start.reduce((a,b)=>a+b,0);
  const unsafe=I.start.filter(b=>b<I.buttonsToBeSafe).length;
  const left=I.buttonsToEnd-sum;
  if(I.nPlayers<3||I.nPlayers>10) warn('The spreadsheet supports 3–10 players; results outside that range are extrapolated.');
  if(sum>=I.buttonsToEnd) warn(`Game is already over: ${sum} buttons on the table ≥ Buttons to End (${I.buttonsToEnd}). Nothing left to fight for.`);
  else if(unsafe<=1) warn(unsafe===0?'Game is already over: every player is already safe.':'Game is already over: all but one player are already safe.');
  else if(left>30) warn('More than 30 hands left — the spreadsheet refuses to run above 30; the exact engine still solves it.');
  else if(left>14) info(`${left} hands left: the spreadsheet only sums the first 14 hands of the desperation model, so its bonus/penalty would come out lower than the full sums shown here.`);
  if(I.buttonsToEnd>=MAX_BTE) warn(`Buttons to End is capped at ${MAX_BTE.toLocaleString()}.`);
  if(I.ffInvalid) warn('Fight Factor must be greater than 0 — using 1 (no extra fight).');
  else if(I.fightFactor<1) warn('Fight Factor below 1 makes safe players fight harder than unsafe ones — probably not intended.');
  else if(I.fightFactor>2) info('Fight Factor above 2 is outside the spreadsheet\'s intended 1–2 range.');
  if(I.squidPay<0) warn('Squid payment is negative.');
  return w;
}

// ===================== orchestration =====================
function solve(){
  const I=readInputs();
  const n=I.nPlayers, safe=I.buttonsToBeSafe;
  const t0=performance.now();
  let engine=I.engine, ev=null, fallback=false;
  if(engine==='exact'){
    try{ ev=exactConditionalEVs(I); }
    catch(e){   // absurdly large game (state cap hit, or recursion as deep as the hands left) → sample it instead
      if(e.message!=='exact-overflow'&&!(e instanceof RangeError)) throw e;
      engine='mc'; fallback=true;
    }
  }
  if(!ev) ev=mcConditionalEVs(I);
  const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;
  const totalEquity=ev.totalEquity, evHeroWins=ev.evHeroWins, evOppWins=ev.evOppWins;

  // Game already over (all but one safe, or every button dealt)? Then there is no "next button":
  // total equity is just the payout of the current state and every ante is undefined.
  const sum=I.start.reduce((a,b)=>a+b,0), unsafe=I.start.filter(b=>b<safe).length;
  const gameOver = unsafe<=1 || sum>=I.buttonsToEnd;
  const heroHasButton=I.start[0]>=safe;
  const ol = ev.X ? outlook(I,ev.X) : null;
  const common={totalEquity,heroHasButton,engine,fallback,states:ev.X?ev.X.size():0,nSims:I.nSims,outlook:ol,warnings:sanity(I),inputs:I};
  if(gameOver) return {...common,gameOver:true,B19:null,despBonus:0,despPenalty:0,anteAll:null,anteSafe:null,anteUnsafe:null,
                       handsLeft:0,oppSafeEVs:[],oppUnsafeEVs:[],undefinedAnte:false,ms:performance.now()-t0};

  const B19=evHeroWins-avg(evOppWins);     // per-hand ante advantage

  // splits: opponents who are safe vs not (by current buttons). null when the group is empty
  // (the sheet shows #N/A there) — never silently aliased to the all-opponents number.
  const oppSafeEVs=[], oppUnsafeEVs=[];
  for(let p=1;p<n;p++) (I.start[p]>=safe?oppSafeEVs:oppUnsafeEVs).push(evOppWins[p-1]);
  const anteVs=arr=>arr.length?evHeroWins-avg(arr):null;

  // Desperation (only if hero currently has no button)
  const desp=desperation(I,B19);
  const despBonus = heroHasButton?0:desp.bonus;
  const despPenalty = heroHasButton?0:desp.penalty;
  const adj=despBonus+despPenalty;

  const anteAll = B19 + adj;
  const s1=anteVs(oppSafeEVs), s2=anteVs(oppUnsafeEVs);
  const anteSafe = s1==null?null:s1+adj;
  const anteUnsafe = s2==null?null:s2+adj;

  return {...common,gameOver:false,B19,despBonus,despPenalty,anteAll,anteSafe,anteUnsafe,
          handsLeft:desp.handsLeft,oppSafeEVs,oppUnsafeEVs,undefinedAnte:!heroHasButton&&!!desp.undefinedAnte,
          ms:performance.now()-t0};
}

// number → "12.34" / "−12.34" (real minus sign), "—" when undefined
function fmt(x,d=2){ if(x==null||!isFinite(x)) return '—'; return (x<0?'−':'')+Math.abs(x).toFixed(d); }
function pct(x){return (100*x).toFixed(1)+'%';}
// tap "i" -> {label}{i}  with explanation panel id
const EXP={
  tall:`How much winning the next button is worth to you right now, in BB, against the table as it is (some opponents may already be safe). It is the per-hand ante (the EV swing between you and an average opponent taking the next button) plus the desperation bonus and penalty. The bigger this number, the harder you should fight for the next pot.`,
  ante:`The raw swing from winning the next hand: your EV if you take the next button minus your EV if an average opponent takes it, before the desperation adjustments.`,
  dbon:`Extra EV you pick up over the rest of the game by getting a button now and capitalizing on opponents who play badly while they're desperate. Only applies when you currently have no button.`,
  dpen:`EV you'd otherwise lose by having to play worse while you hold no button (you only lose to players who already have one). It's added into the total ante as part of what winning the next hand saves you.`,
  eq:`Your expected net result, in BB, from the current state played all the way to the end of the game — every possible finish weighted by its probability. Positive = you expect to profit; negative = you expect to lose on net.`,
  hl:`Buttons still to be handed out before the game ends — Buttons to End minus the buttons already on the table. One button is awarded per hand (the game can also end early once all but one player are safe).`,
};
function ic(id){return `<span class="info" data-exp="${id}" role="button" tabindex="0" aria-label="Explain">i</span>`;}
function exp(id){return `<div class="exp" id="exp-${id}">${EXP[id]}</div>`;}
function render(R){
  const cls=x=>x==null?'':x>=0?'pos':'neg';
  const na=R.gameOver?' (n/a — game over)':R.heroHasButton?' (n/a — hero already safe)':R.handsLeft<=1?' (n/a — last hand)'
          :R.undefinedAnte?' (n/a — ante not positive)':'';
  const warns=R.warnings.filter(w=>w.level==='warn'), infos=R.warnings.filter(w=>w.level==='info');
  const warn=(warns.length?`<div class="warn">${warns.map(w=>'⚠ '+w.msg).join('<br>')}</div>`:'')
            +(infos.length?`<div class="warn info">${infos.map(w=>'ℹ '+w.msg).join('<br>')}</div>`:'');
  const headU=R.gameOver?'<b>Game is already over</b> — no next button to fight for'
             :'<b>First to act</b> (some opponents are safe) — what winning the next button is worth';
  // keep whatever the user has opened (explanation panels, the outlook) open across live re-renders
  const body=$('resBody');
  const openExp=[...body.querySelectorAll('.exp.show')].map(p=>p.id);
  const openOutlook=!!body.querySelector('details.outlook[open]');
  const ol=R.outlook;
  const outlookHtml=ol?`
    <details class="outlook"${openOutlook?' open':''}><summary>Game outlook (exact probabilities)</summary>
      <table class="rtable">
        <tr><td class="lbl">Hero finishes safe (has a button)</td><td>${pct(ol.pHeroSafe)}</td></tr>
        <tr><td class="lbl">Hero's buttons at the end (avg)</td><td>${ol.eHero.toFixed(2)}</td></tr>
        <tr><td class="lbl">Hands still to be played (avg)</td><td>${ol.eHands.toFixed(2)}</td></tr>
        <tr><td class="lbl">Losers at the end (avg)</td><td>${ol.eLosers.toFixed(2)}</td></tr>
        <tr><td class="lbl">Each loser pays (avg, BB)</td><td>${ol.avgLoss.toFixed(2)}</td></tr>
        ${ol.mult.map(m=>`<tr><td class="lbl">Reach ≥${m.t} buttons (×${m.v}) — hero / anyone</td><td>${pct(m.hero)} / ${pct(m.any)}</td></tr>`).join('')}
      </table>
    </details>`:'';
  const engineNote=R.engine==='exact'
    ?`Exact solution: every possible finish enumerated (${R.states.toLocaleString()} states, ${R.ms<1?'<1':Math.round(R.ms)} ms). Results update live as you change inputs.`
    :R.fallback
    ?`This game is too big for the exact engine, so this is a Monte Carlo estimate: ${R.nSims.toLocaleString()} simulated finishes, fixed seed. Live updates are paused — press Run Solver after changing inputs.`
    :`Monte Carlo: ${R.nSims.toLocaleString()} simulated finishes per estimate, fixed seed (stable results). Press Run Solver after changing inputs, or switch the engine to Exact for noise-free live numbers.`;
  body.innerHTML=`
    ${warn}
    <div class="headline">
      <div class="k">Total "Ante" (BB) ${ic('tall')}</div>
      <div class="v ${cls(R.anteAll)}">${fmt(R.anteAll)}</div>
      <div class="u">${headU}</div>
      ${exp('tall')}
    </div>
    <table class="rtable">
      <tr><td class="lbl">Per-hand ante ${ic('ante')}</td><td>${fmt(R.B19)}</td></tr>
      <tr class="exp-host"><td colspan="2">${exp('ante')}</td></tr>
      <tr><td class="lbl">Desperation bonus${na} ${ic('dbon')}</td><td>${fmt(R.despBonus)}</td></tr>
      <tr class="exp-host"><td colspan="2">${exp('dbon')}</td></tr>
      <tr><td class="lbl">Desperation penalty${na} ${ic('dpen')}</td><td>${fmt(R.despPenalty)}</td></tr>
      <tr class="exp-host"><td colspan="2">${exp('dpen')}</td></tr>
      <tr><td class="lbl">Total Equity (current EV) ${ic('eq')}</td><td class="${cls(R.totalEquity)}">${fmt(R.totalEquity)}</td></tr>
      <tr class="exp-host"><td colspan="2">${exp('eq')}</td></tr>
      <tr><td class="lbl">Hands left to play ${ic('hl')}</td><td>${R.handsLeft}</td></tr>
      <tr class="exp-host"><td colspan="2">${exp('hl')}</td></tr>
    </table>
    ${outlookHtml}
    <div class="note">All figures in big blinds (BB). Tap any <span class="info" style="cursor:default">i</span> for an explanation.
      Re-implemented from the Crazy Squid Solver spreadsheet. ${engineNote}</div>`;
  for(const id of openExp){
    const p=document.getElementById(id), chip=body.querySelector(`.info[data-exp="${id.slice(4)}"]`);
    if(p&&chip){ p.classList.add('show'); chip.classList.add('on'); chip.setAttribute('aria-expanded','true'); }
  }
  liveSuspended=!!R.fallback;          // a fallback solve is too slow to repeat on every keystroke
  setLive(R.engine==='exact'?'on':'off');
}
// toggle explanations (event delegation; works for taps on touch devices and the keyboard)
function toggleExp(chip){
  const panel=document.getElementById('exp-'+chip.dataset.exp);
  if(!panel) return;
  const show=!panel.classList.contains('show');
  panel.classList.toggle('show',show);
  chip.classList.toggle('on',show);
  chip.setAttribute('aria-expanded',show);
}
$('resBody').addEventListener('click',e=>{
  const chip=e.target.closest('.info[data-exp]'); if(chip) toggleExp(chip);
});
$('resBody').addEventListener('keydown',e=>{
  if(e.key!=='Enter'&&e.key!==' ') return;
  const chip=e.target.closest('.info[data-exp]'); if(!chip) return;
  e.preventDefault(); toggleExp(chip);
});

// ===================== wiring =====================
// Fields that must hold a number before we re-solve. While one of them is blank (mid-edit) the
// previous result stays on screen, dimmed, instead of flashing a bogus answer computed with 0.
const REQUIRED=['squidPay','buttonsToEnd','buttonsToBeSafe','fightFactor'];
let liveSuspended=false;   // true after the exact engine had to fall back to Monte Carlo (set by render)
const isLive=()=>$('engine').value==='exact'&&!liveSuspended;
function setLive(state){   // 'on' | 'wait' | 'run' | 'off'
  const t=$('liveTag');
  t.classList.toggle('on',state!=='off'); t.classList.toggle('wait',state==='wait'||state==='run');
  t.textContent=state==='wait'?'● waiting for inputs':state==='run'?'● inputs changed — press Run Solver':'● live';
}
function showError(e){ $('resBody').innerHTML='<div class="placeholder">Error: '+e.message+'</div>'; setLive('off'); }
function runSolver(){
  const btn=$('run');
  const missing=REQUIRED.filter(id=>$(id).value.trim()==='');
  $('results').classList.toggle('stale',missing.length>0);
  if(missing.length){ setLive('wait'); return; }
  if(isLive()){
    // exact engine is instant — solve synchronously
    try{ render(solve()); } catch(e){ showError(e); }
    return;
  }
  btn.disabled=true; btn.innerHTML='<span class="spin"></span>Solving…';
  setTimeout(()=>{
    try{ render(solve()); } catch(e){ showError(e); }
    btn.disabled=false; btn.textContent='Run Solver';
  },30);
}
// live recompute (exact engine only): any edit in the inputs card re-solves after a short debounce.
// Otherwise (Monte Carlo, or a game too big for the exact engine) the old numbers dim until Run is pressed.
let liveTimer=null;
function scheduleLive(){
  clearTimeout(liveTimer);
  if(!isLive()){ setLive('run'); $('results').classList.add('stale'); return; }
  liveTimer=setTimeout(runSolver,120);
}
$('nPlayers').addEventListener('input',()=>buildPlayers(false));
$('nPlayers').addEventListener('change',()=>buildPlayers(true));
$('enableMult').addEventListener('change',e=>$('multBlock').classList.toggle('off',!e.target.checked));
$('enableBonus').addEventListener('change',e=>$('bonusBlock').classList.toggle('off',!e.target.checked));
$('inputs').addEventListener('input',scheduleLive);
$('inputs').addEventListener('change',scheduleLive);
$('run').addEventListener('click',runSolver);
buildPlayers(true);
$('multBlock').classList.remove('off');
runSolver();   // exact engine → show results for the default inputs right away

// register service worker for offline / permanent home-screen use
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
